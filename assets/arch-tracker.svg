<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .playhead { animation: scan 1.8s ease-in-out 2; }
      @keyframes scan {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(6px); }
        75% { transform: translateX(-12px); }
      }
    }
  </style>
  <rect width="32" height="32" rx="7" fill="#121a33"/>
  <g fill="#6f9ee8">
    <rect x="5" y="17" width="3" height="9" rx="1"/>
    <rect x="10" y="11" width="3" height="15" rx="1"/>
  </g>
  <rect x="15" y="14" width="3" height="12" rx="1" fill="#b49be8"/>
  <rect x="20" y="8" width="3" height="18" rx="1" fill="#ef6f5e"/>
  <rect x="25" y="19" width="3" height="7" rx="1" fill="#7cc59a"/>
  <rect class="playhead" x="18.6" y="4" width="1.2" height="24" fill="#e5533d"/>
</svg>
